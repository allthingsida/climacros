name: build

on:
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# hcli / IDA Plugin Manager packaging (see kb-ati/references/hcli-cpp-plugins.md):
# each release asset is a FLAT per-IDA-version zip -> ida-plugin.json (idaVersions "==<ver>")
# + climacros.{dll,so,dylib} at the zip root (macOS universal). hcli auto-installs those.
# Windows/Linux ARM64 aren't representable in hcli yet (HexRaysSA/ida-hcli#209), so we still
# BUILD them and carry them in the same zip renamed climacros_aarch64.{dll,so} — lint-clean,
# ignored by hcli today (manual install), forward-compatible if #209 adds arch-suffix resolution.
#
# climacros deploys via METADATA_JSON into a per-plugin subfolder:
# $IDASDK/src/bin/plugins/climacros/climacros.<ext>.

jobs:
  # Mainstream plugin binaries (win-x64, linux-x64, macOS-universal) per IDA version.
  plugin:
    name: Plugin (${{ matrix.os }}, ${{ matrix.sdk }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, macOS, Windows]
        sdk: [v9.2.0-sdk.1, v9.3.1-sdk.1, v9.4.0-release]
        include:
          - os: Linux
            runner: ubuntu-latest
            ext: so
          - os: macOS
            runner: macos-latest
            ext: dylib
          - os: Windows
            runner: windows-latest
            ext: dll
    env:
      IDASDK: ${{ github.workspace }}/ida-sdk
    steps:
      - name: Checkout climacros
        uses: actions/checkout@v4

      - name: Setup IDA SDK (${{ matrix.sdk }}) + our ida-cmake
        shell: bash
        run: |
          git clone --branch ${{ matrix.sdk }} --depth 1 https://github.com/HexRaysSA/ida-sdk ida-sdk
          git clone --depth 1 https://github.com/allthingsida/ida-cmake "${IDASDK}/ida-cmake"

      - name: Configure & build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "Windows" ]; then
            cmake -S . -B build -A x64
            cmake --build build --config Release --parallel
          elif [ "${{ matrix.os }}" = "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
            cmake --build build --parallel
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel
          fi

      - name: Stage plugin + version-stamped metadata
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.sdk }}" in
            v9.2.0-sdk.1)   IDA=9.2 ;;
            v9.3.1-sdk.1)   IDA=9.3 ;;
            v9.4.0-release) IDA=9.4 ;;
            *) echo "unknown sdk"; exit 1 ;;
          esac
          echo "IDA=$IDA" >> "$GITHUB_ENV"
          mkdir -p out
          cp "${IDASDK}/src/bin/plugins/climacros/climacros.${{ matrix.ext }}" out/
          jq ".plugin.idaVersions = \"==${IDA}\"" ida-plugin.json > out/ida-plugin.json
          ls -l out

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-ida${{ env.IDA }}-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  # Native ARM64 plugin binaries, carried in the same zip as climacros_aarch64.<ext>.
  # (win-arm64 libs exist in 9.4; linux-arm64 in 9.3+.)
  plugin-arm:
    name: Plugin ARM (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-arm64-ida9.3
            runner: ubuntu-24.04-arm
            sdk: v9.3.1-sdk.1
            ida: "9.3"
            src: climacros.so
            dst: climacros_aarch64.so
            winarm: "no"
          - label: linux-arm64-ida9.4
            runner: ubuntu-24.04-arm
            sdk: v9.4.0-release
            ida: "9.4"
            src: climacros.so
            dst: climacros_aarch64.so
            winarm: "no"
          - label: windows-arm64-ida9.4
            runner: windows-11-arm
            sdk: v9.4.0-release
            ida: "9.4"
            src: climacros.dll
            dst: climacros_aarch64.dll
            winarm: "yes"
    env:
      IDASDK: ${{ github.workspace }}/ida-sdk
    steps:
      - name: Checkout climacros
        uses: actions/checkout@v4

      - name: Setup IDA SDK (${{ matrix.sdk }}) + our ida-cmake
        shell: bash
        run: |
          git clone --branch ${{ matrix.sdk }} --depth 1 https://github.com/HexRaysSA/ida-sdk ida-sdk
          git clone --depth 1 https://github.com/allthingsida/ida-cmake "${IDASDK}/ida-cmake"

      - name: Configure & build (ARM64)
        shell: bash
        run: |
          if [ "${{ matrix.winarm }}" = "yes" ]; then
            cmake -S . -B build -A ARM64
            cmake --build build --config Release --parallel
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel
          fi

      - name: Stage arm binary (renamed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "${IDASDK}/src/bin/plugins/climacros/${{ matrix.src }}" "out/${{ matrix.dst }}"
          ls -l out

      - name: Upload arm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pluginarm-ida${{ matrix.ida }}-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [plugin, plugin-arm]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble flat hcli plugin zips (per IDA version)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mkdir -p out
          for ida in 9.2 9.3 9.4; do
            rm -rf stage && mkdir -p stage
            found=0
            # mainstream binaries + stamped ida-plugin.json
            for d in artifacts/plugin-ida${ida}-*/; do
              [ -d "$d" ] || continue
              cp -v "$d"/* stage/
              found=1
            done
            [ "$found" = "1" ] || { echo "no mainstream artifacts for ida${ida}"; continue; }
            # arm binaries carried in-zip (already renamed climacros_aarch64.<ext>), if any for this version
            for d in artifacts/pluginarm-ida${ida}-*/; do
              [ -d "$d" ] && cp -v "$d"/* stage/ || true
            done
            ( cd stage && zip -r "../out/climacros-ida${ida}.zip" . )
          done
          echo "=== assets ==="; ls -l out
          echo "=== example contents ==="; unzip -l out/climacros-ida9.4.zip || true

      - name: Lint plugin zips with hcli
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ida-hcli || pipx install ida-hcli || { echo "hcli install failed; skipping lint"; exit 0; }
          for z in out/climacros-ida*.zip; do
            echo "=== hcli plugin lint $z ==="
            hcli plugin lint "$z" || echo "lint reported issues for $z (review)"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: climacros ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: out/climacros-ida*.zip
